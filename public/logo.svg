<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      .stroke-blue { stroke: #2563eb; stroke-width: 16; stroke-linecap: round; stroke-linejoin: round; }
      .stroke-line { stroke: #93c5fd; stroke-width: 14; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Document Base -->
  <rect x="52" y="32" width="316" height="400" rx="36" fill="#eff6ff" class="stroke-blue" />

  <!-- Shield in Document -->
  <path d="M 100 85 Q 155 70 210 85 C 210 150 175 185 155 195 C 135 185 100 150 100 85 Z" fill="#2dd4bf" class="stroke-blue" stroke-width="12" />
  <path d="M 115 98 Q 155 86 195 98 C 195 145 168 172 155 180 C 142 172 115 145 115 98 Z" fill="#3b82f6" />
  <!-- Shield Checkmark -->
  <path d="M 132 135 L 148 155 L 180 115" fill="none" stroke="#fca5a5" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Top Right Document Lines -->
  <line x1="240" y1="92" x2="330" y2="92" class="stroke-line" />
  <line x1="240" y1="128" x2="330" y2="128" class="stroke-line" />
  <line x1="240" y1="164" x2="330" y2="164" class="stroke-line" />

  <!-- Lower Document Text Lines -->
  <line x1="88" y1="240" x2="280" y2="240" class="stroke-line" />
  <line x1="88" y1="280" x2="240" y2="280" class="stroke-line" />
  <line x1="88" y1="320" x2="220" y2="320" class="stroke-line" />
  <line x1="88" y1="360" x2="200" y2="360" class="stroke-line" />

  <!-- Gavel Base (Sound Block) -->
  <path d="M 190 425 L 320 425 L 320 450 L 190 450 Z" fill="#e09f67" class="stroke-blue" />
  <rect x="170" y="448" width="170" height="30" rx="8" fill="#e09f67" class="stroke-blue" />

  <!-- Gavel (Hammer & Handle) -->
  <g transform="rotate(32 350 330)">
    <!-- Gavel Handle -->
    <path d="M 330 300 L 450 300 L 450 326 L 330 326 Z" fill="#e09f67" class="stroke-blue" />
    <rect x="330" y="300" width="30" height="26" fill="#fca5a5" class="stroke-blue" stroke-width="8" />

    <!-- Gavel Head (Cylinder) -->
    <!-- Top rim -->
    <rect x="270" y="222" width="76" height="24" rx="6" fill="#e09f67" class="stroke-blue" />
    <!-- Middle block -->
    <rect x="280" y="244" width="56" height="136" fill="#e09f67" class="stroke-blue" />
    <!-- Bottom rim -->
    <rect x="270" y="378" width="76" height="24" rx="6" fill="#e09f67" class="stroke-blue" />
  </g>
</svg>
